[package]
name = "abyss-reader"
version = "0.1.0"
edition = "2021"

[lib]
name = "abyss_reader_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "abyss-reader"
path = "src/main.rs"

[dependencies]
generic-array = "0.14.7"
hostname = "0.3"
arboard = "3"
ecb = "0.1"
tauri = { version = "2", features = ["webview-data-url", "devtools", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "native-tls", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
encoding_rs = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
once_cell = "1"
parking_lot = "0.12"
url = "2"
regex = "1"
fancy-regex = "0.14"
md5 = "0.7"
urlencoding = "2.1"
deno_core = "0.410"
scraper = "0.27"
markup5ever = "0.39"
ego-tree = "0.11"
aes = "0.8"
des = "0.8.1"
cbc = "0.1"
uuid = { version = "1", features = ["v4"] }
open = "5"
hanconv = "0.5"
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
rand = "0.8"
dirs-next = "2.0"
zip = "2"
ttf-parser = "0.24"
keyring = { version = "4", features = ["apple-native-keyring-store", "dbus-secret-service-keyring-store"] }

[build-dependencies]
generic-array = "0.14.7"
hostname = "0.3"
arboard = "3"
tauri-build = { version = "2", features = [] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = true
incremental = false

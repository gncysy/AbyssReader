name: Build AbyssReader

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: choco install nsis -y
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-v4-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Cache Node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm install
      - name: Build Tauri
        run: npm run tauri build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssReader-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-v4-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Cache Node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm install
      - name: Build Tauri
        run: npm run tauri build
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Set Chinese display name for macOS
        run: |
          APP="src-tauri/target/release/bundle/macos/AbyssReader.app"
          if [ -d "$APP" ]; then
            /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$APP/Contents/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 墨阅" "$APP/Contents/Info.plist"
          else
            echo "App bundle not found at $APP"
            find src-tauri/target/release/bundle -maxdepth 2 -name "*.app" -type d
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssReader-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libsecret-1-dev libdbus-1-dev libssl-dev
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-v4-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Cache Node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm install
      - name: Build Tauri
        run: npm run tauri build
      - name: Debug linuxdeploy failure
        if: failure()
        run: |
          set -x
          echo "=== Residual AppDir ==="
          find src-tauri/target/release/bundle -maxdepth 3 -type d -name "*.AppDir" 2>/dev/null || true

          APPDIR=$(find src-tauri/target/release/bundle -maxdepth 3 -type d -name "*.AppDir" | head -n 1)
          echo "APPDIR=$APPDIR"

          echo "=== linuxdeploy cache location ==="
          find ~/.cache -name "linuxdeploy-*.AppImage" 2>/dev/null || true

          LINUXDEPLOY=$(find ~/.cache -name "linuxdeploy-x86_64.AppImage" 2>/dev/null | head -n 1)
          echo "LINUXDEPLOY=$LINUXDEPLOY"

          echo "=== Manually rerun linuxdeploy ==="
          if [ -n "$APPDIR" ] && [ -n "$LINUXDEPLOY" ]; then
            APPIMAGE_EXTRACT_AND_RUN=1 "$LINUXDEPLOY" --appimage-extract-and-run --verbosity 0 --appdir "$APPDIR" --plugin gtk --output appimage 2>&1 || true
          else
            echo "APPDIR or LINUXDEPLOY not found"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssReader-Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos, build-linux]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AbyssReader-Windows
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AbyssReader-macOS
          path: dist/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: AbyssReader-Linux
          path: dist/linux

      - name: Flatten artifacts
        run: |
          find dist -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.app" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec sh -c 'for f; do cp "$f" dist/$(basename "$f"); done' sh {} +

      - name: Generate SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} \; | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.app
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
